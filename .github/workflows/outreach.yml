name: Selah Outreach Bot

on:
  schedule:
    - cron: "10 12 * * *" # every day 12:10 UTC (staggered 10min after the SEO bot)
  workflow_dispatch: {}

jobs:
  outreach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python main_outreach.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-fable-5-1
          GMAIL_ENABLED: ${{ vars.GMAIL_ENABLED || 'false' }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: Commit state
        run: |
          git config user.name "selah-outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outreach/targets.csv
          if [ "${{ vars.GMAIL_ENABLED }}" != "true" ]; then git add outreach/drafts; fi
          git diff --staged --quiet || git commit -m "outreach bot: new candidates / pitch drafts"
          git pull --rebase && git push

      - name: Upload drafts as an artifact too
        if: ${{ vars.GMAIL_ENABLED != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: outreach-drafts-${{ github.run_id }}
          path: outreach/drafts/
