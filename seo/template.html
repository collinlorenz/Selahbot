<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<meta name="description" content="{{ meta_description }}">
<link rel="canonical" href="{{ site_url }}/posts/{{ slug }}/">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ meta_description }}">
<meta property="og:type" content="article">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ title | tojson }},
  "description": {{ meta_description | tojson }},
  "datePublished": "{{ date }}"
}
</script>
<style>
  body { font-family: -apple-system, Georgia, serif; max-width: 640px; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.65; color: #1c1c1c; }
  h1 { font-size: 1.75rem; line-height: 1.3; }
  .cta { display: block; text-align: center; background: #1c1c1c; color: #fff; text-decoration: none; padding: 0.9rem; border-radius: 10px; margin: 2.5rem 0; font-weight: 600; }
  .back { font-size: 0.9rem; }
  a { color: #1c1c1c; }
</style>
</head>
<body>
<p class="back"><a href="{{ site_url }}/">← All posts</a></p>
<h1>{{ title }}</h1>
{{ body_html }}
{% if related %}
<h2>Related reading</h2>
<ul>
{% for r in related %}<li><a href="{{ site_url }}/posts/{{ r.slug }}/">{{ r.title }}</a></li>
{% endfor %}
</ul>
{% endif %}
<a class="cta" href="{{ app_store_url }}">Get Selah on the App Store</a>
</body>
</html>
