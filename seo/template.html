<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ site_url }}/posts/{{ slug }}/">
  <link rel="stylesheet" href="{{ site_url }}/style.css">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="article">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": {{ title | tojson }},
    "description": {{ meta_description | tojson }},
    "datePublished": "{{ date }}"
  }
  </script>
  </head>
<body>
  <nav class="nav">
      <a class="nav-mark" href="{{ site_url }}/">Selah</a>
      <a class="nav-cta" href="{{ app_store_url }}">Get the App</a>
  </nav>
  <div class="wrap">
      <article>
            <h1>{{ title }}</h1>
          <p class="meta">{{ date }}</p>
          <div class="prose">
                {{ body_html }}
          </div>
      </article>
    {% if related %}
    <div class="more-entries">
        <h2>More entries</h2>
        <div class="more-grid">
            {% for r in related %}<a href="{{ site_url }}/posts/{{ r.slug }}/">
                  <p class="more-title">{{ r.title }}</p>
                  <p class="more-excerpt">{{ r.meta_description }}</p>
            </a>
            {% endfor %}
        </div>
    </div>
    {% endif %}
    <a class="cta" href="{{ app_store_url }}">Get Selah on the App Store</a>
  </div>
</body>
</html>
  </div>
</body>
