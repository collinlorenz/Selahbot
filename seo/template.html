<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ site_url }}/posts/{{ slug }}/">
  <link rel="stylesheet" href="{{ site_url }}/style.css">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="article">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": {{ title | tojson }},
    "description": {{ meta_description | tojson }},
    "datePublished": "{{ date }}"
  }
  </script>
  </head>
<body>
  <div class="wrap">
      <p class="back"><a href="{{ site_url }}/">&larr; All posts</a></p>
      <article>
            <h1>{{ title }}</h1>
          <p class="meta">{{ date }}</p>
          <div class="prose">
                {{ body_html }}
          </div>
      </article>
    {% if related %}
    <div class="related">
        <h2>Related reading</h2>
        <ul>
              {% for r in related %}<li><a href="{{ site_url }}/posts/{{ r.slug }}/">{{ r.title }}</a></li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    <a class="cta" href="{{ app_store_url }}">Get Selah on the App Store</a>
  </div>
</body>
</html>
</body>
</html>
